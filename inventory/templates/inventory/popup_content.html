<!-- inventory/templates/inventory/popup_content.html -->
<div class="container-fluid">
    <div class="alert alert-info py-2">
        <h3 class="m-0 text-center">{{ total }} <small class="fs-6">counted by you</small></h3>
    </div>

    <!-- The Form submits to the MAIN detail view, but redirects back to Search -->
    <form action="{% url 'product_detail' product.id %}" method="post">
        {% csrf_token %}
        
        <!-- MAGIC TRICK: This tells the view to redirect back to the Search page after saving -->
        <input type="hidden" name="next" value="{{ request.META.HTTP_REFERER }}">

        <div class="row">
            <div class="col-6">
                <label class="form-label small">Location</label>
                {{ form.location }}
            </div>
            <div class="col-6">
                <label class="form-label small">Qty</label>
                {{ form.quantity }}
            </div>
        </div>

        <!-- Quick Buttons -->
        <div class="d-flex gap-2 mt-2">
            <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setPopQty(1)">+1</button>
            <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setPopQty(5)">+5</button>
            <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setPopQty(10)">+10</button>
        </div>

        <button type="submit" class="btn btn-success w-100 mt-3">SAVE & CLOSE</button>
    </form>

    <hr>
    <h6>History for {{ product.item_code }}</h6>
<ul class="list-group list-group-flush small" style="max-height: 150px; overflow-y: auto;">
    {% for entry in entries %}
    <li class="list-group-item d-flex justify-content-between align-items-center p-1">
        
        <!-- Left side: Location & Quantity -->
        <div>
            <span class="text-muted me-2">{{ entry.location }}:</span>
            <strong>{{ entry.quantity }}</strong>
        </div>

        <!-- Right side: Delete Button -->
        <a href="{% url 'delete_entry' entry.id %}" 
           class="text-danger text-decoration-none fw-bold px-2"
           title="Delete this entry"
           onclick="return confirm('Are you sure you want to remove this count?');">
            &#10006; <!-- This is the HTML code for a nice 'X' symbol -->
        </a>
        
    </li>
    {% empty %}
    <li class="list-group-item text-center text-muted">No counts yet</li>
    {% endfor %}
</ul>
</div>
