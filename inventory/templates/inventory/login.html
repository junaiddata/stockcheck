{% extends 'inventory/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center">Team Login</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

            </form>
        </div>
    </div>
</div>
{% endblock %}
